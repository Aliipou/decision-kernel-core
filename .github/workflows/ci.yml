name: ci

on: [push, pull_request]

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install "cryptography>=42" "jsonschema>=4.0" "pytest>=8.0" "ruff>=0.6" "mypy>=1.11"
      - name: Lint (ruff)
        run: ruff check kernel tests
      - name: Types (mypy)
        run: mypy kernel
      - name: Tests (pytest — engine, authority, tokens, contract conformance, rule A)
        run: pytest -q
